# Applies agents' listing-site updates (price, status, open house, video) from the
# "JLR Listing Site Updates" Google Sheet, then redeploys the main website so
# www.jleadersrealty.org matches. Runs every hour; can also be run by hand.
name: Listing site updates
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: site-updates
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SHEET_CSV: https://docs.google.com/spreadsheets/d/1AJT37c-Zw_gGVaBtYVRkUbQ-jME6M5IXvQqD9mihQNE/export?format=csv&gid=0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply updates
        run: python3 _tools/apply_updates.py
      - name: Save and redeploy
        run: |
          set -e
          git config user.name "jlr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A listings.json _tools/site-updates-log.json */index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Listing site updates from agents"
          git pull --rebase -q && git push
          if git diff --name-only HEAD~1 | grep -q '^listings.json$'; then gh workflow run website-deploy.yml; fi
