# Builds listing assets so nobody has to handle files by hand.
# - hero-source.txt  (one https URL of the Higgsfield drone clip)  -> hero.mp4, hero-sm.mp4, hero-start.jpg, hero-end.jpg
# - photos-source.txt (one "filename.jpg https://url" per line)    -> photos/filename.jpg (web-sized)
name: Build listing assets
on:
  push:
    paths: ['**/hero-source.txt', '**/photos-source.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Hero clips
        run: |
          set -e
          for src in $(git ls-files '*hero-source.txt'); do
            dir=$(dirname "$src")
            url=$(tr -d '[:space:]' < "$src")
            if [ -f "$dir/hero.mp4" ] && [ "$(cat "$dir/.hero-built" 2>/dev/null)" = "$url" ]; then continue; fi
            echo "Encoding $dir from $url"
            curl -fsSL "$url" -o /tmp/src.mp4
            # every frame a keyframe so scrolling can jump to any moment instantly
            ffmpeg -y -loglevel error -i /tmp/src.mp4 -an -vf "scale=1280:-2,fps=30" -c:v libx264 -preset slow -crf 27 -g 1 -pix_fmt yuv420p -movflags +faststart "$dir/hero.mp4"
            ffmpeg -y -loglevel error -i /tmp/src.mp4 -an -vf "scale=720:-2,fps=30" -c:v libx264 -preset slow -crf 28 -g 1 -pix_fmt yuv420p -movflags +faststart "$dir/hero-sm.mp4"
            ffmpeg -y -loglevel error -i /tmp/src.mp4 -vf "scale=1600:-2" -frames:v 1 -q:v 3 "$dir/hero-start.jpg"
            ffmpeg -y -loglevel error -sseof -0.1 -i /tmp/src.mp4 -vf "scale=1600:-2" -frames:v 1 -q:v 3 "$dir/hero-end.jpg"
            echo "$url" > "$dir/.hero-built"
          done
      - name: Listing photos
        run: |
          set -e
          for src in $(git ls-files '*photos-source.txt'); do
            dir=$(dirname "$src")
            sum=$(sha1sum "$src" | cut -c1-40)
            if [ "$(cat "$dir/.photos-built" 2>/dev/null)" = "$sum" ]; then continue; fi
            mkdir -p "$dir/photos"
            while read -r name url; do
              [ -z "$name" ] && continue
              case "$name" in \#*) continue;; esac
              echo "Photo $dir/photos/$name"
              curl -fsSL "$url" -o /tmp/p.img
              ffmpeg -y -loglevel error -i /tmp/p.img -vf "scale='min(1600,iw)':-2" -q:v 4 "$dir/photos/$name"
            done < "$src"
            echo "$sum" > "$dir/.photos-built"
          done
      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Build listing assets
