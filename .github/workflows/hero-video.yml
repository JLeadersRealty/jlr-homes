# Turns a Higgsfield hero clip into a scroll-ready video for a listing page.
# Trigger: commit a file named hero-source.txt (containing the clip's https URL) into a listing folder.
name: Build hero video
on:
  push:
    paths: ['**/hero-source.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Encode any listing whose clip URL is new
        run: |
          set -e
          for src in $(git ls-files '*hero-source.txt'); do
            dir=$(dirname "$src")
            url=$(tr -d '[:space:]' < "$src")
            if [ -f "$dir/hero.mp4" ] && [ "$(cat "$dir/.hero-built" 2>/dev/null)" = "$url" ]; then continue; fi
            echo "Encoding $dir from $url"
            curl -fsSL "$url" -o /tmp/src.mp4
            # every frame a keyframe so scrolling can jump to any moment instantly
            ffmpeg -y -loglevel error -i /tmp/src.mp4 -an -vf "scale=1280:-2,fps=30" -c:v libx264 -preset slow -crf 27 -g 1 -pix_fmt yuv420p -movflags +faststart "$dir/hero.mp4"
            ffmpeg -y -loglevel error -i /tmp/src.mp4 -an -vf "scale=720:-2,fps=30" -c:v libx264 -preset slow -crf 28 -g 1 -pix_fmt yuv420p -movflags +faststart "$dir/hero-sm.mp4"
            ffmpeg -y -loglevel error -i /tmp/src.mp4 -vf "scale=1600:-2" -frames:v 1 -q:v 3 "$dir/hero-start.jpg"
            ffmpeg -y -loglevel error -sseof -0.1 -i /tmp/src.mp4 -vf "scale=1600:-2" -frames:v 1 -q:v 3 "$dir/hero-end.jpg"
            echo "$url" > "$dir/.hero-built"
          done
      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Build hero video
