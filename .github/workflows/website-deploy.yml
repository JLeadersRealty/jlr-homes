# Publishes the main website (www.jleadersrealty.org) to Cloudflare Pages project "jlr-website".
# _website/ holds the built site. Jekyll ignores folders that start with "_", so it never shows on homes.jleadersrealty.org.
# The "Our Listings" cards on the homepage are rebuilt from listings.json on every deploy (_tools/render_home.py).
# Claude updates the site by dropping a zip in the "JLR Website Bundles" Drive folder and running this with its file ID.
name: Deploy main website
on:
  push:
    branches: [main]
    paths: ['_website/**', 'listings.json', '_tools/render_home.py']
  workflow_dispatch:
    inputs:
      bundles:
        description: 'Drive file IDs of site zips to unpack into _website (comma separated). Leave blank to just redeploy.'
        required: false
        default: ''
permissions:
  contents: write
concurrency: website-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f66193d08a12dd0421635aac4664a34a
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundles from Drive
        if: ${{ github.event.inputs.bundles != '' && github.event.inputs.bundles != null }}
        run: |
          set -e
          mkdir -p _website /tmp/b
          IFS=',' read -ra IDS <<< "${{ github.event.inputs.bundles }}"
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | tr -cd 'A-Za-z0-9_-')
            curl -sSL "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" -o /tmp/b/$id.zip
            unzip -tq /tmp/b/$id.zip
            unzip -oq /tmp/b/$id.zip -d _website
            echo "unpacked $id"
          done
      - name: Fetch missing photos and videos from the live site
        run: |
          set -e
          if [ -f _website/_assets.txt ]; then
            while read -r f; do
              f=$(echo "$f" | tr -cd 'A-Za-z0-9_./-')
              case "$f" in img/*|video/*) ;; *) continue ;; esac
              if [ ! -s "_website/$f" ]; then mkdir -p "_website/$(dirname "$f")"; curl -sSfL "https://www.jleadersrealty.org/$f" -o "_website/$f" && echo "fetched $f"; fi
            done < _website/_assets.txt
          fi
      - name: Save to repo
        if: ${{ github.event.inputs.bundles != '' && github.event.inputs.bundles != null }}
        run: |
          set -e
          git config user.name "jlr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _website
          git diff --cached --quiet && echo "no changes" || (git commit -qm "Website update from bundle" && git push)
      - name: Render homepage listings from listings.json
        run: python3 _tools/render_home.py
      - name: Build site search index
        run: python3 _tools/build_search_index.py
      - name: Safety checks
        run: |
          set -e
          test -f _website/index.html
          cp _website/_worker.js /tmp/w.mjs && node --check /tmp/w.mjs
          hits=$(grep -rEo "fka_[A-Za-z0-9]{10,}|re_[A-Za-z0-9]{16,}|sk[-_][A-Za-z0-9]{16,}" _website --include=*.html --include=*.js | wc -l)
          if [ "$hits" -gt 0 ]; then echo "STOPPING: something that looks like a key is in the site files"; exit 1; fi
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy _website --project-name=jlr-website --branch=main --commit-dirty=true
