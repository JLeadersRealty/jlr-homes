# One-time fix (11/24): the office line 402.773.8511 can't receive texts yet (FUB texting approval pending).
# Points every "Text" button/link to the listing agent's cell (Jamie 402.306.6255 by default). Run once by hand.
name: Fix text links (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fix text links
        run: |
          cat > /tmp/fix.py <<'PYEOF'
          import re, pathlib
          def sub(path, old, new, count_expected=None):
              p = pathlib.Path(path); s = p.read_text(encoding="utf-8"); n = s.count(old)
              if n == 0: print("skip (not found):", path, old[:50]); return
              p.write_text(s.replace(old, new), encoding="utf-8"); print(f"fixed {n}x:", path)
          JAMIE = "sms:+14023066255"
          for f in ["16538-burdette/index.html", "203-2nd-st/index.html", "505-brady/index.html", "201-main-minden/index.html"]:
              sub(f, 'href="sms:+14027738511">Text us', f'href="{JAMIE}">Text Jamie')
          sub("103-washington/index.html", 'href="sms:+14027738511">Text us', 'href="sms:+15317772241">Text Harlie')
          sub("933-east-ridge/index.html", 'href="sms:+14027738511">Text us', 'href="sms:+14029801396">Text Kris')
          sub("_website/search/index.html", 'href="sms:+14027738511"', f'href="{JAMIE}"')
          for old in ["Call or text the office at 402.773.8511, reach Broker/Owner Jamie Leaders directly at 402.306.6255,"]:
              sub("_website/index.html", old, "Call the office at 402.773.8511, call or text Broker/Owner Jamie Leaders directly at 402.306.6255,")
          sub("jlr.js", "'<a href=\"tel:+14027738511\">Call</a><a class=\"alt\" href=\"sms:+14027738511\">Text</a>';",
              "'<a href=\"tel:+14027738511\">Call</a><a class=\"alt\" href=\"sms:+1' + (String(D.agentPhone || '').replace(/\\D/g, '').slice(-10) || '4023066255') + '\">Text</a>';")
          sub("jlr.js", "Please call or text 402.773.8511 and we", "Please call 402.773.8511 or text 402.306.6255 and we")
          PYEOF
          python3 /tmp/fix.py
      - name: Save and redeploy
        run: |
          set -e
          git config user.name "jlr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to fix"; exit 0; fi
          git commit -qm "Point Text links to agents' cells (office line can't text yet)"
          git pull --rebase -q && git push
          gh workflow run website-deploy.yml
